# Optional: only needed if you want invoice history to survive
# Streamlit Community Cloud restarts / redeploys.
# Add these values in Streamlit Community Cloud > App settings > Secrets.
# Create a PRIVATE Supabase Storage bucket named ecoquill-persistence first.
SUPABASE_URL = "https://YOUR_PROJECT.supabase.co"
SUPABASE_SERVICE_KEY = "YOUR_SERVICE_ROLE_KEY"
SUPABASE_BUCKET = "ecoquill-persistence"
